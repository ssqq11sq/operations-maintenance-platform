# 运维管理系统 — 与 qjsl 并存
# - http://IP:8080
# - http(s)://omp.qjwater-gs.com （HTTPS 由 setup_omp_https.py 写入 omp-ssl.inc）

upstream omp_api_upstream {
    server 127.0.0.1:3001;
    keepalive 16;
}

map $http_upgrade $connection_upgrade_omp {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 20m;
    root /home/ubuntu/omp_platform/apps/web/dist;
    index index.html;

    include /etc/nginx/sites-available/omp-m.inc;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://omp_api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://omp_api_upstream/uploads/;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass http://omp_api_upstream/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_omp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP：ACME 校验；有证书后跳转 HTTPS，否则提供站点
server {
    listen 80;
    listen [::]:80;
    server_name omp.qjwater-gs.com;

    client_max_body_size 20m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/sites-available/omp-http-root.inc;
}

include /etc/nginx/sites-available/omp-ssl.inc;

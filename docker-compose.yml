services:
  mysql:
    image: mysql:8.0
    container_name: omp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: omp
      MYSQL_USER: omp
      MYSQL_PASSWORD: omp123
    ports:
      - "3306:3306"
    volumes:
      - omp_mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0
    container_name: omp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - omp_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: omp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - omp_minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  omp_mysql_data:
  omp_redis_data:
  omp_minio_data:
